<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на получение визы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">
    <h1>Заявка на получение визы</h1>
    <p class="hint">Поля, отмеченные звёздочкой (*), обязательны для заполнения.</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- 1. Личные данные -->
        <fieldset>
            <legend>Личные данные</legend>

            <div class="row">
                <label for="surname">Фамилия *</label>
                <input type="text" id="surname" name="surname" placeholder="Фамилия *" required>
            </div>

            <div class="row">
                <label for="name">Имя *</label>
                <input type="text" id="name" name="name" placeholder="Имя *" required>
            </div>

            <div class="row">
                <label for="birthday" class="always">Дата рождения *</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <div class="row">
                <span class="caption">Пол *</span>
                <div class="options">
                    <label><input type="radio" name="gender" value="m" required> Мужской</label>
                    <label><input type="radio" name="gender" value="f"> Женский</label>
                </div>
            </div>

            <div class="row">
                <label for="citizenship">Гражданство *</label>
                <input type="text" id="citizenship" name="citizenship" list="countries" placeholder="Гражданство *" required>
                <datalist id="countries">
                    <option value="Россия">
                    <option value="Беларусь">
                    <option value="Казахстан">
                    <option value="Узбекистан">
                    <option value="Кыргызстан">
                </datalist>
            </div>
        </fieldset>

        <!-- 2. Паспорт -->
        <fieldset>
            <legend>Заграничный паспорт</legend>

            <div class="row">
                <label for="passport">Номер паспорта *</label>
                <input type="text" id="passport" name="passport" placeholder="Номер паспорта * (например, 75 1234567)" pattern="[0-9]{2} [0-9]{7}" required>
            </div>

            <div class="row">
                <label for="issued" class="always">Дата выдачи *</label>
                <input type="date" id="issued" name="issued" required>
            </div>

            <div class="row">
                <label for="expires" class="always">Действителен до *</label>
                <input type="date" id="expires" name="expires" required>
            </div>
        </fieldset>

        <!-- 3. Контакты -->
        <fieldset>
            <legend>Контактные данные</legend>

            <div class="row">
                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" placeholder="E-mail *" required>
            </div>

            <div class="row">
                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" name="phone" placeholder="Телефон * (+7 900 000-00-00)" required>
            </div>

            <div class="row">
                <label for="address">Домашний адрес</label>
                <textarea id="address" name="address" rows="3" placeholder="Домашний адрес"></textarea>
            </div>
        </fieldset>

        <!-- 4. Поездка -->
        <fieldset>
            <legend>Информация о поездке</legend>

            <div class="row">
                <label for="country">Страна поездки *</label>
                <select id="country" name="country" required>
                    <option value="" disabled selected>Страна поездки *</option>
                    <optgroup label="Европа">
                        <option value="fr">Франция</option>
                        <option value="it">Италия</option>
                        <option value="es">Испания</option>
                    </optgroup>
                    <optgroup label="Азия">
                        <option value="cn">Китай</option>
                        <option value="jp">Япония</option>
                    </optgroup>
                    <optgroup label="Америка">
                        <option value="us">США</option>
                        <option value="ca">Канада</option>
                    </optgroup>
                </select>
            </div>

            <div class="row">
                <span class="caption">Тип визы *</span>
                <div class="options">
                    <label><input type="radio" name="visa" value="tourist" required> Туристическая</label>
                    <label><input type="radio" name="visa" value="business"> Деловая</label>
                    <label><input type="radio" name="visa" value="study"> Учебная</label>
                </div>
            </div>

            <div class="row">
                <label for="date-in" class="always">Дата въезда *</label>
                <input type="date" id="date-in" name="date_in" required>
            </div>

            <div class="row">
                <label for="days">Срок пребывания (дней) *</label>
                <input type="number" id="days" name="days" min="1" max="90" placeholder="Срок пребывания, дней * (1–90)" required>
            </div>

            <div class="row">
                <span class="caption">Ранее были визы</span>
                <div class="options">
                    <label><input type="checkbox" name="before[]" value="schengen"> Шенгенская</label>
                    <label><input type="checkbox" name="before[]" value="usa"> США</label>
                    <label><input type="checkbox" name="before[]" value="uk"> Великобритании</label>
                </div>
            </div>
        </fieldset>

        <!-- 5. Документы -->
        <fieldset>
            <legend>Документы</legend>

            <div class="row">
                <label for="photo" class="always">Фотография 3,5×4,5 *</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </div>

            <div class="row">
                <label for="scan" class="always">Скан паспорта *</label>
                <input type="file" id="scan" name="scan" accept=".pdf,image/*" required>
            </div>

            <div class="row">
                <label for="comment">Дополнительно</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Дополнительная информация"></textarea>
            </div>
        </fieldset>

        <div class="agree">
            <label><input type="checkbox" name="agree" required> Я согласен на обработку персональных данных *</label>
        </div>

        <div class="buttons">
            <button type="submit">Отправить заявку</button>
            <button type="reset" class="reset">Очистить</button>
        </div>
    </form>
</div>
</body>
</html>
