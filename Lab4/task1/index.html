<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная 4. Задание 1. Кошка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Кошка</h1>

    <div class="scene">
        <!-- фон -->
        <div class="sun"></div>
        <div class="floor"></div>

        <!-- клубок ниток -->
        <div class="ball"></div>
        <div class="ball-line ball-line1"></div>
        <div class="ball-line ball-line2"></div>
        <div class="thread"></div>

        <!-- хвост -->
        <div class="tail"></div>

        <!-- туловище -->
        <div class="body"></div>
        <div class="belly"></div>
        <div class="paw paw-left"></div>
        <div class="paw paw-right"></div>

        <!-- уши -->
        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>
        <div class="ear-inner ear-inner-left"></div>
        <div class="ear-inner ear-inner-right"></div>

        <!-- голова -->
        <div class="head"></div>
        <div class="stripe stripe1"></div>
        <div class="stripe stripe2"></div>
        <div class="stripe stripe3"></div>

        <!-- глаза -->
        <div class="eye eye-left"><div class="pupil"></div><div class="glint"></div></div>
        <div class="eye eye-right"><div class="pupil"></div><div class="glint"></div></div>

        <!-- нос и рот -->
        <div class="nose"></div>
        <div class="mouth mouth-left"></div>
        <div class="mouth mouth-right"></div>

        <!-- усы -->
        <div class="whisker w1"></div>
        <div class="whisker w2"></div>
        <div class="whisker w3"></div>
        <div class="whisker w4"></div>
        <div class="whisker w5"></div>
        <div class="whisker w6"></div>
    </div>
</body>
</html>
