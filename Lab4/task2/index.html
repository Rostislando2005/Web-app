<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная 4. Задание 2. Забивание гвоздя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Забивание гвоздя молотком</h1>
    <p class="hint">Наведите мышку на картинку, чтобы поставить анимацию на паузу</p>

    <div class="scene">
        <!-- гвоздь -->
        <div class="nail">
            <div class="nail-head"></div>
            <div class="nail-body"></div>
            <div class="nail-tip"></div>
        </div>

        <!-- доска (закрывает ту часть гвоздя, которая вошла в дерево) -->
        <div class="board"></div>

        <!-- молоток -->
        <div class="hammer">
            <div class="hammer-head"></div>
            <div class="handle"></div>
        </div>

        <!-- надпись при ударе -->
        <div class="bang">Тук!</div>
    </div>
</body>
</html>
